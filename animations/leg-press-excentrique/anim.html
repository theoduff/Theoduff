<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body.preview { background: #6b7f8c; }
  svg { display: block; }
  .lbl { font-family: 'Inter'; font-weight: 800; font-size: 25px; letter-spacing: 2.5px; fill: #fff; }
  .cap1 { font-family: 'Inter'; font-weight: 800; font-size: 50px; letter-spacing: 1px; fill: #fff; }
  .cap2 { font-family: 'Caladea'; font-style: italic; font-size: 50px; fill: #fff; }
  .capsub { font-family: 'Inter'; font-weight: 500; font-size: 23px; letter-spacing: 0.5px; fill: #fff; opacity: .82; }
  .tl { font-family: 'Inter'; font-weight: 700; font-size: 20px; letter-spacing: 1.6px; fill: #fff; }
  .num { font-family: 'Inter'; font-weight: 800; font-size: 26px; fill: #0b1620; }
</style>
</head>
<body>
<svg id="svg" xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="textGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/>
      <feFlood flood-color="#2ea8ff" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6f7ff"/>
      <stop offset="45%" stop-color="#6cd0ff"/>
      <stop offset="100%" stop-color="#1e8cff"/>
    </radialGradient>
    <mask id="maskFar" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1080"><rect width="1080" height="1080" fill="#fff"/><g id="maskFarShapes" fill="#000"></g></mask>
    <mask id="maskBody" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1080"><rect width="1080" height="1080" fill="#fff"/><g id="maskBodyShapes" fill="#000"></g></mask>
    <mask id="maskNear" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1080"><rect width="1080" height="1080" fill="#fff"/><g id="maskNearShapes" fill="#000"></g></mask>
    <clipPath id="clipNearThigh"><path id="clipNearThighPath"/></clipPath>
  </defs>

  <g id="root">
    <g id="machine" filter="url(#shadow)" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"></g>
    <g id="arrow"></g>
    <!-- far leg (behind) -->
    <g id="farLeg" opacity="0.55">
      <g id="farFill" fill="#0c141c" fill-opacity="0.72"></g>
      <g id="farOutline" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round" mask="url(#maskFar)"></g>
      <g id="farMuscles"></g>
    </g>
    <!-- torso / head / arm -->
    <g id="body">
      <g id="bodyFill" fill="#0c141c" fill-opacity="0.72"></g>
      <g id="glute"></g>
      <g id="bodyOutline" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round" mask="url(#maskBody)" filter="url(#shadow)"></g>
    </g>
    <!-- near (working) leg -->
    <g id="nearLeg">
      <g id="nearFill" fill="#0c141c" fill-opacity="0.72"></g>
      <g id="nearMuscles"></g>
      <g id="nearOutline" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round" mask="url(#maskNear)" filter="url(#shadow)"></g>
    </g>
    <g id="labels"></g>
    <g id="caption"></g>
    <g id="timeline"></g>
  </g>
</svg>

<script>
// ---------- helpers ----------
const V = (x, y) => ({x, y});
const add = (a, b) => V(a.x + b.x, a.y + b.y);
const sub = (a, b) => V(a.x - b.x, a.y - b.y);
const mul = (a, k) => V(a.x * k, a.y * k);
const len = a => Math.hypot(a.x, a.y);
const norm = a => { const l = len(a) || 1; return V(a.x / l, a.y / l); };
const rot = (a, th) => V(a.x * Math.cos(th) - a.y * Math.sin(th), a.x * Math.sin(th) + a.y * Math.cos(th));
const lerp = (a, b, k) => a + (b - a) * k;
const lerpV = (a, b, k) => V(lerp(a.x, b.x, k), lerp(a.y, b.y, k));
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeSine = x => { x = clamp(x); return -(Math.cos(Math.PI * x) - 1) / 2; };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const f1 = n => n.toFixed(1);
const P = p => `${f1(p.x)},${f1(p.y)}`;
const $ = id => document.getElementById(id);
const deg = r => r * 180 / Math.PI;

// 2-link IK. side=-1 bends "upward" (counter-clockwise on screen)
function ik(a, b, L1, L2, side) {
  let d = len(sub(b, a));
  d = Math.min(d, L1 + L2 - 0.5);
  const dir = norm(sub(b, a));
  const cosA = clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
  const al = Math.acos(cosA);
  return add(a, mul(rot(dir, side * al), L1));
}
// tapered capsule between a(r1) and b(r2)
function capsule(a, b, r1, r2) {
  const dir = norm(sub(b, a));
  const n = V(-dir.y, dir.x);
  const a1 = add(a, mul(n, r1)), b1 = add(b, mul(n, r2));
  const b2 = sub(b, mul(n, r2)), a2 = sub(a, mul(n, r1));
  return `M${P(a1)} L${P(b1)} A${r2} ${r2} 0 0 0 ${P(b2)} L${P(a2)} A${r1} ${r1} 0 0 0 ${P(a1)} Z`;
}
const circle = (c, r) => `M${f1(c.x - r)},${f1(c.y)} a${r},${r} 0 1 0 ${2 * r},0 a${r},${r} 0 1 0 ${-2 * r},0 Z`;
// muscle "belly" in segment-local coordinates (x along a->b, y: + = posterior / below)
function belly(a, b, x0, x1, yc, h) {
  const dir = norm(sub(b, a)), n = V(-dir.y, dir.x);
  const L = len(sub(b, a));
  const W = (x, y) => add(add(a, mul(dir, x * L)), mul(n, y));
  const w = x1 - x0;
  const p0 = W(x0, yc), p1 = W(x1, yc);
  const c1 = W(x0 + .22 * w, yc - 1.35 * h), c2 = W(x0 + .7 * w, yc - 1.35 * h);
  const c3 = W(x0 + .7 * w, yc + 1.35 * h), c4 = W(x0 + .22 * w, yc + 1.35 * h);
  return { d: `M${P(p0)} C${P(c1)} ${P(c2)} ${P(p1)} C${P(c3)} ${P(c4)} ${P(p0)} Z`, center: W(x0 + .5 * w, yc) };
}

// ---------- geometry ----------
const H = V(380, 640);                         // hip (near)
const uAng = -25 * Math.PI / 180;
const U = V(Math.cos(uAng), Math.sin(uAng));   // rail direction (push)
const PL = V(U.y, -U.x);                       // along plate, pointing up/back (toes)
const TD = norm(V(-0.766, -0.643));            // torso direction (hip -> shoulder)
const TN = V(-0.643, 0.766);                   // posterior normal of torso (towards seat back)
const L_TH = 232, L_SH = 222;
const D_TOP = 430, D_BOT = 236;                // hip->ankle distances
const FAR = V(16, -11);                        // far leg depth offset
const REST = V(640, 878);                      // far foot resting on the frame

// ---------- timeline ----------
const T = { in: 0.6, push1: 2.2, off0: 2.25, off1: 2.9, ecc1: 6.6, on0: 6.6, on1: 7.15, push2a: 7.2, push2b: 8.8, end: 10 };
function dist(t) {
  if (t < T.in) return D_BOT;
  if (t < T.push1) return lerp(D_BOT, D_TOP, ease(seg(t, T.in, T.push1)));
  if (t < T.off1) return D_TOP;
  if (t < T.ecc1) return lerp(D_TOP, D_BOT, easeSine(seg(t, T.off1, T.ecc1)));
  if (t < T.push2a) return D_BOT;
  if (t < T.push2b) return lerp(D_BOT, D_TOP, ease(seg(t, T.push2a, T.push2b)));
  return D_TOP;
}
function farOff(t) { // 0 = on plate, 1 = resting
  if (t < T.off0) return 0;
  if (t < T.off1) return ease(seg(t, T.off0, T.off1));
  if (t < T.on0) return 1;
  if (t < T.on1) return 1 - ease(seg(t, T.on0, T.on1));
  return 0;
}
// raw activation targets (0..1)
function rawAct(t) {
  const d = dist(t), depth = (D_TOP - d) / (D_TOP - D_BOT);
  const a = { quad: .12, glute: .06, ham: .04, farQuad: .08, farGlute: .04, phase: 0 };
  const inPush = (t >= T.in && t < T.push1) || (t >= T.push2a && t < T.push2b);
  const inEcc = t >= T.off1 && t < T.ecc1;
  if (inPush) {
    a.quad = .82 + .15 * depth; a.glute = .35 + .55 * depth; a.ham = .22 + .2 * depth;
    a.farQuad = a.quad; a.farGlute = a.glute;
  } else if (t >= T.off0 && t < T.off1) {
    a.quad = .45; a.glute = .25; a.ham = .15;
  } else if (inEcc) {
    a.quad = .78 + .22 * depth; a.glute = .3 + .65 * depth; a.ham = .22 + .28 * depth;
  } else if (t >= T.ecc1 && t < T.push2a) {
    a.quad = .9; a.glute = .85; a.ham = .45; a.farQuad = .4 * seg(t, T.on0, T.push2a); a.farGlute = .3 * seg(t, T.on0, T.push2a);
  } else if (t < T.in) {
    a.quad = .3; a.glute = .3; a.ham = .1; a.farQuad = .3; a.farGlute = .3;
  }
  return a;
}
// smoothed activation (box filter over +-0.16 s)
function act(t) {
  const keys = ['quad', 'glute', 'ham', 'farQuad', 'farGlute'];
  const out = {}; keys.forEach(k => out[k] = 0);
  const N = 11, w = 0.16;
  for (let i = 0; i < N; i++) {
    const r = rawAct(t + (i / (N - 1) * 2 - 1) * w);
    keys.forEach(k => out[k] += r[k] / N);
  }
  // eccentric "tension" shimmer
  const ecc = smooth(seg(t, T.off1, T.off1 + .3)) * (1 - smooth(seg(t, T.ecc1 - .2, T.ecc1 + .1)));
  const shimmer = ecc * (0.07 * Math.sin(2 * Math.PI * 3.2 * t) + 0.04 * Math.sin(2 * Math.PI * 7.1 * t));
  out.quad = clamp(out.quad + shimmer);
  out.glute = clamp(out.glute + shimmer * .7);
  out.ecc = ecc;
  return out;
}

// ---------- leg pose ----------
function legPose(hip, ankleTarget, footAngle) {
  const knee = ik(hip, ankleTarget, L_TH, L_SH, -1);
  const ankle = add(knee, mul(norm(sub(ankleTarget, knee)), Math.min(L_SH, len(sub(ankleTarget, knee)))));
  return { hip, knee, ankle, footAngle };
}
function footPath(ankle, ang) {
  // ang: direction of the sole (heel -> toe). foot normal points "out" of the sole towards ankle
  const s = V(Math.cos(ang), Math.sin(ang));
  const n = V(-s.y, s.x); // from ankle towards the sole
  const sole = add(ankle, mul(n, 24));          // sole centre under ankle
  const heel = add(sole, mul(s, -22));
  const toe = add(sole, mul(s, 66));
  const toeTop = add(toe, mul(n, -20));
  const instep = add(add(ankle, mul(s, 22)), mul(n, -8));
  const back = add(add(ankle, mul(s, -14)), mul(n, 2));
  return `M${P(heel)} L${P(toe)} Q${P(add(toe, mul(n, -12)))} ${P(toeTop)} L${P(instep)} Q${P(add(ankle, mul(n, -12)))} ${P(back)} Q${P(add(heel, mul(n, -4)))} ${P(heel)} Z`;
}
function legShapes(p) {
  return [
    capsule(p.hip, p.knee, 44, 29),
    capsule(p.knee, p.ankle, 28, 15),
    footPath(p.ankle, p.footAngle),
  ];
}

// ---------- static-ish builders ----------
function line(a, b, w, o) { return `<line x1="${f1(a.x)}" y1="${f1(a.y)}" x2="${f1(b.x)}" y2="${f1(b.y)}" stroke-width="${w}" stroke-opacity="${o}"/>`; }

function drawMachine(d) {
  const C = add(H, mul(U, d + 24));               // plate face centre
  const plateA = add(C, mul(PL, -110)), plateB = add(C, mul(PL, 150));
  const plateA2 = add(plateA, mul(U, 22)), plateB2 = add(plateB, mul(U, 22));
  const railA = add(add(H, mul(PL, -205)), mul(U, 130)), railB = add(add(H, mul(PL, -205)), mul(U, 610));
  const carriage = add(add(H, mul(PL, -205)), mul(U, d + 46));
  let s = '';
  // base frame
  s += line(V(170, 905), V(930, 905), 7, .55);
  s += line(V(200, 905), V(200, 925), 7, .45) + line(V(900, 905), V(900, 925), 7, .45);
  // rail + uprights
  s += line(railA, railB, 6, .5);
  s += line(railB, V(railB.x, 905), 6, .4);
  s += line(railA, V(railA.x, 905), 6, .35);
  // carriage arm
  s += line(add(plateA2, mul(PL, 30)), carriage, 8, .55);
  s += `<circle cx="${f1(carriage.x)}" cy="${f1(carriage.y)}" r="9" fill="#fff" fill-opacity=".55" stroke="none"/>`;
  // plate
  s += `<path d="M${P(plateA)} L${P(plateB)} L${P(plateB2)} L${P(plateA2)} Z" fill="#0c141c" fill-opacity=".6" stroke-width="5" stroke-opacity=".9"/>`;
  // plate handle
  const h1 = add(plateB2, mul(PL, -20)), h2 = add(add(plateB2, mul(U, 34)), mul(PL, -40)), h3 = add(add(plateB2, mul(U, 34)), mul(PL, -150));
  // seat back pad
  const sb0 = add(add(H, mul(TN, 58)), mul(TD, -20)), sb1 = add(add(H, mul(TN, 58)), mul(TD, 270));
  s += line(sb0, sb1, 20, .28) + line(sb0, sb1, 4, .7);
  // headrest
  const hr0 = add(add(H, mul(TN, 52)), mul(TD, 300)), hr1 = add(add(H, mul(TN, 52)), mul(TD, 360));
  s += line(hr0, hr1, 18, .28) + line(hr0, hr1, 4, .7);
  // seat pan
  const sp0 = V(300, 700), sp1 = V(500, 690);
  s += line(sp0, sp1, 18, .28) + line(sp0, sp1, 4, .7);
  // seat supports
  s += line(V(420, 700), V(420, 905), 6, .4);
  const backBase = add(add(H, mul(TN, 66)), mul(TD, 140));
  s += line(backBase, V(backBase.x + 40, 905), 6, .4);
  // grip handle
  s += line(V(410, 690), V(445, 790), 6, .45);
  s += line(V(445, 790), V(520, 905), 6, .35);
  $('machine').innerHTML = s;
  return C;
}

// ---------- labels ----------
const LABELS = [
  { key: 'quad', name: 'QUADRICEPS', pos: V(250, 222), anchorSide: 'right' },
  { key: 'glute', name: 'FESSIERS', pos: V(70, 790), anchorSide: 'right' },
  { key: 'ham', name: 'ISCHIO-JAMBIERS', pos: V(560, 955), anchorSide: 'left' },
];
function labelSvg(L, a, anchor, vis) {
  const padX = 18, h = 46;
  const tw = L.name.length * 18.2 + 6;
  const w = tw + padX * 2;
  const x = L.pos.x, y = L.pos.y;
  const on = clamp((a - .2) / .6);
  const barW = w - padX * 2;
  // leader
  const lx = L.anchorSide === 'left' ? x : x + w;
  const ly = y + h / 2;
  const mid = V(lx + (L.anchorSide === 'left' ? -28 : 28), ly);
  let s = `<g opacity="${f1(vis * (0.55 + 0.45 * on))}">`;
  s += `<path d="M${P(V(lx, ly))} L${P(mid)} L${P(anchor)}" fill="none" stroke="#fff" stroke-width="2.5" stroke-opacity=".85" filter="url(#shadow)"/>`;
  s += `<circle cx="${f1(anchor.x)}" cy="${f1(anchor.y)}" r="${f1(5 + 3 * on)}" fill="#fff"/>`;
  s += `<circle cx="${f1(anchor.x)}" cy="${f1(anchor.y)}" r="${f1(14 + 10 * on)}" fill="#3db4ff" opacity="${f1(.55 * on)}" filter="url(#glowSoft)"/>`;
  s += `<rect x="${x}" y="${y}" width="${f1(w)}" height="${h + 14}" rx="12" fill="#0b131b" fill-opacity=".72"/>`;
  s += `<rect x="${x}" y="${y}" width="${f1(w)}" height="${h + 14}" rx="12" fill="none" stroke="#5cc6ff" stroke-width="2" stroke-opacity="${f1(on * .9)}"/>`;
  s += `<text class="lbl" x="${x + padX}" y="${y + 33}" ${on > .3 ? 'filter="url(#textGlow)"' : ''}>${L.name}</text>`;
  s += `<rect x="${x + padX}" y="${y + h}" width="${f1(barW)}" height="5" rx="2.5" fill="#fff" fill-opacity=".18"/>`;
  s += `<rect x="${x + padX}" y="${y + h}" width="${f1(barW * clamp(a))}" height="5" rx="2.5" fill="#5cc6ff"/>`;
  s += `</g>`;
  return s;
}

// ---------- caption ----------
const CAPS = [
  { n: '1', a: 'POUSSÉE', b: 'à deux pieds', sub: 'Phase concentrique · les deux jambes poussent', t0: 0.0, t1: 2.25 },
  { n: '2', a: 'DESCENTE', b: 'sur un seul genou', sub: 'Excentrique lente · on freine jusqu’à la flexion max', t0: 2.25, t1: 6.75 },
  { n: '3', a: 'REPOUSSÉE', b: 'à deux pieds', sub: 'On repose le 2ᵉ pied · on repousse ensemble', t0: 6.75, t1: 10.5 },
];
function captionSvg(t) {
  let s = '';
  CAPS.forEach(c => {
    const fin = smooth(seg(t, c.t0, c.t0 + .35)), fout = 1 - smooth(seg(t, c.t1 - .25, c.t1 + .1));
    const o = Math.min(fin, fout);
    if (o <= 0.001) return;
    const dy = (1 - fin) * 18 - (1 - fout) * 12;
    const wA = c.a.length * 34.5, wB = c.b.length * 21.5;
    const total = 58 + 18 + wA + 16 + wB;
    const x0 = 540 - total / 2, y0 = 70 + dy;
    s += `<g opacity="${f1(o)}">`;
    s += `<rect x="${f1(x0 - 30)}" y="${f1(y0 - 22)}" width="${f1(total + 60)}" height="136" rx="22" fill="#0b131b" fill-opacity=".72"/>`;
    s += `<circle cx="${f1(x0 + 29)}" cy="${f1(y0 + 28)}" r="27" fill="#5cc6ff" filter="url(#textGlow)"/>`;
    s += `<text class="num" x="${f1(x0 + 29)}" y="${f1(y0 + 37.5)}" text-anchor="middle">${c.n}</text>`;
    s += `<text x="${f1(x0 + 58 + 18)}" y="${f1(y0 + 46)}"><tspan class="cap1">${c.a}</tspan><tspan class="cap2" dx="16">${c.b}</tspan></text>`;
    s += `<text class="capsub" x="540" y="${f1(y0 + 95)}" text-anchor="middle">${c.sub}</text>`;
    s += `</g>`;
  });
  return s;
}

// ---------- bottom timeline ----------
const TL = { x0: 120, x1: 960, y: 1040, t0: T.in, t1: T.push2b };
function timelineSvg(t) {
  const parts = [
    { a: T.in, b: T.push1 + .05, name: '2 PIEDS ↑' },
    { a: T.push1 + .05, b: T.push2a - .05, name: '1 GENOU ↓  EXCENTRIQUE' },
    { a: T.push2a - .05, b: T.push2b, name: '2 PIEDS ↑' },
  ];
  const X = tt => lerp(TL.x0, TL.x1, (tt - TL.t0) / (TL.t1 - TL.t0));
  let s = `<g filter="url(#shadow)">`;
  parts.forEach((p, i) => {
    const xa = X(p.a) + (i ? 5 : 0), xb = X(p.b) - (i < 2 ? 5 : 0);
    const prog = clamp((t - p.a) / (p.b - p.a));
    const active = t >= p.a && t < p.b;
    s += `<rect x="${f1(xa)}" y="${TL.y}" width="${f1(xb - xa)}" height="8" rx="4" fill="#fff" fill-opacity=".3"/>`;
    s += `<rect x="${f1(xa)}" y="${TL.y}" width="${f1((xb - xa) * prog)}" height="8" rx="4" fill="#5cc6ff"/>`;
    s += `<text class="tl" x="${f1((xa + xb) / 2)}" y="${TL.y - 12}" text-anchor="middle" opacity="${active ? 1 : .6}" ${active ? 'filter="url(#textGlow)"' : ''}>${p.name}</text>`;
  });
  const px = clamp(X(t), TL.x0, TL.x1);
  s += `<circle cx="${f1(px)}" cy="${TL.y + 4}" r="9" fill="#fff"/>`;
  s += `</g>`;
  return s;
}

// ---------- direction arrow ----------
function arrowSvg(t, C) {
  const pushO = Math.max(smooth(seg(t, T.in, T.in + .25)) * (1 - smooth(seg(t, T.push1 - .25, T.push1))),
                         smooth(seg(t, T.push2a, T.push2a + .25)) * (1 - smooth(seg(t, T.push2b - .25, T.push2b))));
  const eccO = smooth(seg(t, T.off1, T.off1 + .3)) * (1 - smooth(seg(t, T.ecc1 - .3, T.ecc1)));
  const base = add(C, mul(PL, 205));
  let s = '';
  const arrow = (dirSign, o, color, label) => {
    if (o < .01) return '';
    const a = add(base, mul(U, -60 * dirSign)), b = add(base, mul(U, 60 * dirSign));
    const d = mul(U, dirSign), n = V(-d.y, d.x);
    const h1 = add(sub(b, mul(d, 22)), mul(n, 14)), h2 = sub(sub(b, mul(d, 22)), mul(n, 14));
    let g = `<g opacity="${f1(o)}" filter="url(#shadow)">`;
    g += `<path d="M${P(a)} L${P(b)} M${P(h1)} L${P(b)} L${P(h2)}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;
    g += `</g>`;
    return g;
  };
  s += arrow(1, pushO, '#5cc6ff');
  s += arrow(-1, eccO, '#ffffff');
  return s;
}

// ---------- muscles ----------
function muscleSvg(d, a, scale = 1) {
  // halo + core + outline
  let s = '';
  if (a > 0.01) {
    s += `<path d="${d}" fill="#1e8cff" opacity="${f1(clamp(a * 1.0 * scale))}" filter="url(#glow)" transform-origin="center"/>`;
    s += `<path d="${d}" fill="#3db4ff" opacity="${f1(clamp(a * .85 * scale))}" filter="url(#glowSoft)"/>`;
    s += `<path d="${d}" fill="#9fe3ff" opacity="${f1(clamp((a - .35) * 1.1 * scale))}"/>`;
  }
  s += `<path d="${d}" fill="none" stroke="#fff" stroke-width="2" stroke-opacity=".38"/>`;
  return s;
}
function fibers(p, x0, x1, yc, h, n) {
  // subtle fibre lines within a belly (for the anatomical look)
  const dir = norm(sub(p.knee, p.hip)), nn = V(-dir.y, dir.x), L = len(sub(p.knee, p.hip));
  let s = '';
  for (let i = 1; i < n; i++) {
    const k = i / n * 2 - 1;
    const W = (x, y) => add(add(p.hip, mul(dir, x * L)), mul(nn, y));
    const a = W(x0 + .08, yc + k * h * .55), b = W(x1 - .08, yc + k * h * .55), c = W((x0 + x1) / 2, yc + k * h * 1.0);
    s += `<path d="M${P(a)} Q${P(c)} ${P(b)}" fill="none" stroke="#fff" stroke-width="1.3" stroke-opacity=".22"/>`;
  }
  return s;
}

// ---------- frame ----------
function render(t) {
  const d = dist(t);
  const A = act(t);
  const C = drawMachine(d);

  // near leg
  const ankleN = add(H, mul(U, d));
  const plateAng = Math.atan2(PL.y, PL.x);
  const near = legPose(H, ankleN, plateAng);

  // far leg
  const k = farOff(t);
  const hipF = add(H, FAR);
  const plateAnkleF = add(add(H, mul(U, d)), FAR);
  const restAnkle = REST;
  const lift = Math.sin(Math.PI * k);
  let ankleF = lerpV(plateAnkleF, restAnkle, k);
  ankleF = add(ankleF, mul(V(-0.6, -0.8), 55 * lift));
  const floorAng = -6 * Math.PI / 180;
  // interpolate angles (shortest path)
  let da = floorAng - plateAng; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
  const far = legPose(hipF, ankleF, plateAng + da * smooth(k));

  // torso / head / arm
  const S = add(H, mul(TD, 250));
  const headC = add(add(S, mul(TD, 74)), mul(TN, -6));
  const hand = V(408, 694);
  const elbow = ik(S, hand, 162, 150, 1);
  const torso = [
    capsule(add(H, mul(TN, 6)), add(S, mul(TN, 4)), 54, 50),
    capsule(S, headC, 16, 16),
    circle(headC, 38),
  ];
  const arm = [capsule(S, elbow, 20, 15), capsule(elbow, hand, 15, 12), circle(hand, 14)];

  // --- far leg
  const farSh = legShapes(far);
  $('farFill').innerHTML = farSh.map(p => `<path d="${p}"/>`).join('');
  $('farOutline').innerHTML = farSh.map(p => `<path d="${p}"/>`).join('');
  $('maskFarShapes').innerHTML = farSh.map(p => `<path d="${p}"/>`).join('');
  const fq = belly(far.hip, far.knee, .14, .9, -10, 17);
  $('farMuscles').innerHTML = muscleSvg(fq.d, A.farQuad);

  // --- body
  const bodySh = torso.concat(arm);
  $('bodyFill').innerHTML = torso.map(p => `<path d="${p}"/>`).join('');
  $('bodyOutline').innerHTML = bodySh.map(p => `<path d="${p}"/>`).join('');
  $('maskBodyShapes').innerHTML = bodySh.map(p => `<path d="${p}"/>`).join('');
  // glute (sits under / behind the hip, against the seat)
  const gC = add(add(H, mul(TN, 34)), mul(TD, 4));
  const gl = `M${P(add(gC, V(-46, -8)))} C${P(add(gC, V(-48, -44)))} ${P(add(gC, V(30, -48)))} ${P(add(gC, V(46, -10)))} C${P(add(gC, V(56, 26)))} ${P(add(gC, V(-30, 40)))} ${P(add(gC, V(-46, -8)))} Z`;
  $('glute').innerHTML = '';

  // --- near leg
  const nearSh = legShapes(near);
  // arm drawn on top of the near leg? (hand is beside the seat, under the thigh) -> keep body layer below the leg
  $('nearFill').innerHTML = nearSh.map(p => `<path d="${p}"/>`).join('') + arm.map(p => `<path d="${p}"/>`).join('');
  $('nearOutline').innerHTML = nearSh.map(p => `<path d="${p}"/>`).join('');
  $('maskNearShapes').innerHTML = nearSh.map(p => `<path d="${p}"/>`).join('');
  const q = belly(near.hip, near.knee, .13, .92, -11, 18);
  const hm = belly(near.hip, near.knee, .1, .84, 15, 13);
  $('nearMuscles').innerHTML =
    muscleSvg(gl, A.glute) + muscleSvg(hm.d, A.ham) + fibers(near, .13, .92, -11, 18, 4) + muscleSvg(q.d, A.quad);

  // --- labels
  const glAnchor = add(gC, V(-10, 8));
  const vis = 1;
  $('labels').innerHTML =
    labelSvg(LABELS[0], A.quad, q.center, vis) +
    labelSvg(LABELS[1], A.glute, glAnchor, vis) +
    labelSvg(LABELS[2], A.ham, hm.center, vis);

  $('arrow').innerHTML = arrowSvg(t, C);
  $('caption').innerHTML = captionSvg(t);
  $('timeline').innerHTML = timelineSvg(t);

  // global fade in / out
  const g = smooth(seg(t, 0, .45)) * (1 - smooth(seg(t, 9.5, 10)));
  $('root').setAttribute('opacity', g.toFixed(3));
}
window.render = render;
const qs = new URLSearchParams(location.search);
if (qs.has('t')) render(parseFloat(qs.get('t')));
if (qs.has('preview')) document.body.classList.add('preview');
</script>
</body>
