<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Style "feutre" : silhouette blanche, contour noir, ombre grise, lueurs bleues. Aucun texte. -->
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body.preview { background: #6b7f8c; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="svg" xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="55 160 970 970">
  <defs>
    <!-- léger tremblé de feutre -->
    <filter id="marker" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="aura" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="24"/></filter>
    <clipPath id="clipFar"></clipPath>
    <clipPath id="clipMain"></clipPath>
    <clipPath id="clipArm"></clipPath>
  </defs>
  <g id="root">
    <g id="ground"></g>
    <g id="machineBack"></g>
    <g id="aura"></g>
    <g id="far" filter="url(#marker)"></g>
    <g id="farGlow" clip-path="url(#clipFar)"></g>
    <g id="main" filter="url(#marker)"></g>
    <g id="mainGlow" clip-path="url(#clipMain)"></g>
    <g id="arm" filter="url(#marker)"></g>
    <g id="machineFront"></g>
    <g id="motion"></g>
  </g>
</svg>
<script>
// ---------- helpers ----------
const V = (x, y) => ({x, y});
const add = (a, b) => V(a.x + b.x, a.y + b.y);
const sub = (a, b) => V(a.x - b.x, a.y - b.y);
const mul = (a, k) => V(a.x * k, a.y * k);
const len = a => Math.hypot(a.x, a.y);
const norm = a => { const l = len(a) || 1; return V(a.x / l, a.y / l); };
const rot = (a, th) => V(a.x * Math.cos(th) - a.y * Math.sin(th), a.x * Math.sin(th) + a.y * Math.cos(th));
const lerp = (a, b, k) => a + (b - a) * k;
const lerpV = (a, b, k) => V(lerp(a.x, b.x, k), lerp(a.y, b.y, k));
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeSine = x => { x = clamp(x); return -(Math.cos(Math.PI * x) - 1) / 2; };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const f1 = n => n.toFixed(1);
const P = p => `${f1(p.x)},${f1(p.y)}`;
const $ = id => document.getElementById(id);
const deg = r => r * 180 / Math.PI;

// 2-link IK. side=-1 bends "upward" (counter-clockwise on screen)
function ik(a, b, L1, L2, side) {
  let d = len(sub(b, a));
  d = Math.min(d, L1 + L2 - 0.5);
  const dir = norm(sub(b, a));
  const cosA = clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
  const al = Math.acos(cosA);
  return add(a, mul(rot(dir, side * al), L1));
}
// tapered capsule between a(r1) and b(r2)
function capsule(a, b, r1, r2) {
  const dir = norm(sub(b, a));
  const n = V(-dir.y, dir.x);
  const a1 = add(a, mul(n, r1)), b1 = add(b, mul(n, r2));
  const b2 = sub(b, mul(n, r2)), a2 = sub(a, mul(n, r1));
  return `M${P(a1)} L${P(b1)} A${r2} ${r2} 0 0 0 ${P(b2)} L${P(a2)} A${r1} ${r1} 0 0 0 ${P(a1)} Z`;
}
const circle = (c, r) => `M${f1(c.x - r)},${f1(c.y)} a${r},${r} 0 1 0 ${2 * r},0 a${r},${r} 0 1 0 ${-2 * r},0 Z`;
// muscle "belly" in segment-local coordinates (x along a->b, y: + = posterior / below)
function belly(a, b, x0, x1, yc, h) {
  const dir = norm(sub(b, a)), n = V(-dir.y, dir.x);
  const L = len(sub(b, a));
  const W = (x, y) => add(add(a, mul(dir, x * L)), mul(n, y));
  const w = x1 - x0;
  const p0 = W(x0, yc), p1 = W(x1, yc);
  const c1 = W(x0 + .22 * w, yc - 1.35 * h), c2 = W(x0 + .7 * w, yc - 1.35 * h);
  const c3 = W(x0 + .7 * w, yc + 1.35 * h), c4 = W(x0 + .22 * w, yc + 1.35 * h);
  return { d: `M${P(p0)} C${P(c1)} ${P(c2)} ${P(p1)} C${P(c3)} ${P(c4)} ${P(p0)} Z`, center: W(x0 + .5 * w, yc) };
}

// ---------- geometry ----------
const H = V(380, 640);                         // hip (near)
const uAng = -25 * Math.PI / 180;
const U = V(Math.cos(uAng), Math.sin(uAng));   // rail direction (push)
const PL = V(U.y, -U.x);                       // along plate, pointing up/back (toes)
const TD = norm(V(-0.766, -0.643));            // torso direction (hip -> shoulder)
const TN = V(-0.643, 0.766);                   // posterior normal of torso (towards seat back)
const L_TH = 232, L_SH = 222;
const D_TOP = 430, D_BOT = 236;                // hip->ankle distances
const FAR = V(16, -11);                        // far leg depth offset
const REST = V(640, 878);                      // far foot resting on the frame

// ---------- timeline ----------
const T = { in: 0.6, push1: 2.2, off0: 2.25, off1: 2.9, ecc1: 6.6, on0: 6.6, on1: 7.15, push2a: 7.2, push2b: 8.8, end: 10 };
function dist(t) {
  if (t < T.in) return D_BOT;
  if (t < T.push1) return lerp(D_BOT, D_TOP, ease(seg(t, T.in, T.push1)));
  if (t < T.off1) return D_TOP;
  if (t < T.ecc1) return lerp(D_TOP, D_BOT, easeSine(seg(t, T.off1, T.ecc1)));
  if (t < T.push2a) return D_BOT;
  if (t < T.push2b) return lerp(D_BOT, D_TOP, ease(seg(t, T.push2a, T.push2b)));
  return D_TOP;
}
function farOff(t) { // 0 = on plate, 1 = resting
  if (t < T.off0) return 0;
  if (t < T.off1) return ease(seg(t, T.off0, T.off1));
  if (t < T.on0) return 1;
  if (t < T.on1) return 1 - ease(seg(t, T.on0, T.on1));
  return 0;
}
// raw activation targets (0..1)
function rawAct(t) {
  const d = dist(t), depth = (D_TOP - d) / (D_TOP - D_BOT);
  const a = { quad: .12, glute: .06, ham: .04, farQuad: .08, farGlute: .04, phase: 0 };
  const inPush = (t >= T.in && t < T.push1) || (t >= T.push2a && t < T.push2b);
  const inEcc = t >= T.off1 && t < T.ecc1;
  if (inPush) {
    a.quad = .82 + .15 * depth; a.glute = .35 + .55 * depth; a.ham = .22 + .2 * depth;
    a.farQuad = a.quad; a.farGlute = a.glute;
  } else if (t >= T.off0 && t < T.off1) {
    a.quad = .45; a.glute = .25; a.ham = .15;
  } else if (inEcc) {
    a.quad = .78 + .22 * depth; a.glute = .3 + .65 * depth; a.ham = .22 + .28 * depth;
  } else if (t >= T.ecc1 && t < T.push2a) {
    a.quad = .9; a.glute = .85; a.ham = .45; a.farQuad = .4 * seg(t, T.on0, T.push2a); a.farGlute = .3 * seg(t, T.on0, T.push2a);
  } else if (t < T.in) {
    a.quad = .3; a.glute = .3; a.ham = .1; a.farQuad = .3; a.farGlute = .3;
  }
  return a;
}
// smoothed activation (box filter over +-0.16 s)
function act(t) {
  const keys = ['quad', 'glute', 'ham', 'farQuad', 'farGlute'];
  const out = {}; keys.forEach(k => out[k] = 0);
  const N = 11, w = 0.16;
  for (let i = 0; i < N; i++) {
    const r = rawAct(t + (i / (N - 1) * 2 - 1) * w);
    keys.forEach(k => out[k] += r[k] / N);
  }
  // eccentric "tension" shimmer
  const ecc = smooth(seg(t, T.off1, T.off1 + .3)) * (1 - smooth(seg(t, T.ecc1 - .2, T.ecc1 + .1)));
  const shimmer = ecc * (0.07 * Math.sin(2 * Math.PI * 3.2 * t) + 0.04 * Math.sin(2 * Math.PI * 7.1 * t));
  out.quad = clamp(out.quad + shimmer);
  out.glute = clamp(out.glute + shimmer * .7);
  out.ecc = ecc;
  return out;
}


// ---------- sketch style ----------
const INK = '#1a1a1a', GREY = '#b9b9b9', W = 8;      // contour noir, ombre grise
const SH = V(-18, -15);                                  // décalage de la partie blanche -> ombre grise en bas/droite

function legPose(hip, ankleTarget, footAngle) {
  const knee = ik(hip, ankleTarget, L_TH, L_SH, -1);
  const ankle = add(knee, mul(norm(sub(ankleTarget, knee)), Math.min(L_SH, len(sub(ankleTarget, knee)))));
  return { hip, knee, ankle, footAngle };
}
// pied effilé, en pointe (style croquis)
function footPath(ankle, ang) {
  const s = V(Math.cos(ang), Math.sin(ang));
  const n = V(-s.y, s.x);                        // de la cheville vers la semelle
  const heel = add(add(ankle, mul(n, 22)), mul(s, -16));
  const toe = add(add(ankle, mul(n, 20)), mul(s, 62));
  const top = add(add(ankle, mul(n, -6)), mul(s, 10));
  const back = add(add(ankle, mul(n, -4)), mul(s, -12));
  return `M${P(back)} Q${P(add(heel, mul(s, -6)))} ${P(heel)} L${P(toe)} Q${P(add(top, mul(s, 26)))} ${P(top)} Z`;
}
function legShapes(p) {
  return [capsule(p.hip, p.knee, 42, 26), capsule(p.knee, p.ankle, 25, 11), footPath(p.ankle, p.footAngle)];
}
// silhouette feutre : contour (trait épais derrière) + gris + blanc décalé (clip)
function figure(shapes, clipId) {
  const ps = (attrs) => shapes.map(d => `<path d="${d}" ${attrs}/>`).join('');
  return `<g>${ps(`fill="${INK}" stroke="${INK}" stroke-width="${2 * W}" stroke-linejoin="round"`)}` +
         `${ps(`fill="${GREY}"`)}` +
         `<g clip-path="url(#${clipId})"><g transform="translate(${SH.x},${SH.y})">${ps('fill="#fff"')}</g></g></g>`;
}
function stroke(d, w, c = INK, extra = '') { return `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`; }
const L2 = (a, b) => `M${P(a)} L${P(b)}`;

function muscle(d, a) {
  if (a < 0.01) return '';
  return `<path d="${d}" fill="#0a6cff" opacity="${f1(clamp(a))}" filter="url(#glow)"/>` +
         `<path d="${d}" fill="#1f8fff" opacity="${f1(clamp(a))}" filter="url(#glowSoft)"/>` +
         `<path d="${d}" fill="#5cc4ff" opacity="${f1(clamp((a - .3) * 1.3))}" filter="url(#glowSoft)"/>`;
}
function auraBlob(c, r, a) {
  if (a < 0.02) return '';
  return `<circle cx="${f1(c.x)}" cy="${f1(c.y)}" r="${r}" fill="#2ea8ff" opacity="${f1(a * .8)}" filter="url(#aura)"/>`;
}

function machine(d) {
  const C = add(H, mul(U, d + 24));                       // face du plateau
  const pA = add(C, mul(PL, -105)), pB = add(C, mul(PL, 145));
  const railA = add(add(H, mul(PL, -205)), mul(U, 150)), railB = add(add(H, mul(PL, -205)), mul(U, 600));
  const car = add(add(H, mul(PL, -205)), mul(U, d + 46));
  let back = '', front = '';
  // structure (derrière la figure)
  back += stroke(L2(V(190, 905), V(920, 905)), 7);
  back += stroke(L2(railA, railB), 6);
  back += stroke(L2(railB, V(railB.x, 905)), 6);
  back += stroke(L2(V(420, 700), V(420, 905)), 6);
  const bb = add(add(H, mul(TN, 66)), mul(TD, 140));
  back += stroke(L2(bb, V(bb.x + 40, 905)), 6);
  // dossier + assise : boudins blancs contour noir
  const sb0 = add(add(H, mul(TN, 74)), mul(TD, -20)), sb1 = add(add(H, mul(TN, 74)), mul(TD, 330));
  back += stroke(L2(sb0, sb1), 30) + stroke(L2(sb0, sb1), 16, GREY) + stroke(L2(add(sb0, V(-3, -3)), add(sb1, V(-3, -3))), 10, '#fff');
  const s0 = V(300, 712), s1 = V(500, 702);
  back += stroke(L2(s0, s1), 28) + stroke(L2(s0, s1), 14, GREY) + stroke(L2(add(s0, V(-2, -3)), add(s1, V(-2, -3))), 8, '#fff');
  // plateau (devant)
  front += stroke(L2(add(car, mul(U, 0)), add(pA, mul(PL, 30))), 7);
  front += stroke(L2(add(pA, mul(U, 12)), add(pB, mul(U, 12))), 30) + stroke(L2(add(pA, mul(U, 14)), add(pB, mul(U, 14))), 14, GREY);
  front += `<circle cx="${f1(car.x)}" cy="${f1(car.y)}" r="10" fill="${INK}"/>`;
  return { back, front, C, pA, pB };
}

function render(t) {
  const d = dist(t), A = act(t);
  const M = machine(d);

  // ombre au sol
  $('ground').innerHTML = stroke('M200,938 Q560,928 930,924', 22, GREY, 'opacity=".9"') ;
  $('machineBack').innerHTML = `<g filter="url(#marker)">${M.back}</g>`;

  // poses
  const plateAng = Math.atan2(PL.y, PL.x);
  const near = legPose(H, add(H, mul(U, d)), plateAng);
  const k = farOff(t);
  const hipF = add(H, FAR);
  let ankleF = lerpV(add(add(H, mul(U, d)), FAR), REST, k);
  ankleF = add(ankleF, mul(V(-0.6, -0.8), 55 * Math.sin(Math.PI * k)));
  let da = (-6 * Math.PI / 180) - plateAng; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
  const far = legPose(hipF, ankleF, plateAng + da * smooth(k));

  const S = add(H, mul(TD, 240));
  const headC = add(add(S, mul(TD, 88)), mul(TN, -4));
  const hand = V(412, 700);
  const elbow = ik(S, hand, 160, 150, 1);

  // jambe arrière (grisée légèrement par son ombre)
  const farSh = legShapes(far);
  $('clipFar').innerHTML = farSh.map(p => `<path d="${p}"/>`).join('');
  $('far').innerHTML = figure(farSh, 'clipFar');
  const fq = belly(far.hip, far.knee, .14, .9, -10, 16);
  $('farGlow').innerHTML = muscle(fq.d, A.farQuad);

  // corps + jambe avant = une seule silhouette
  const torso = capsule(H, S, 50, 38);
  const head = `M${f1(headC.x)},${f1(headC.y - 36)} C${f1(headC.x + 26)},${f1(headC.y - 38)} ${f1(headC.x + 32)},${f1(headC.y + 30)} ${f1(headC.x + 2)},${f1(headC.y + 34)} C${f1(headC.x - 30)},${f1(headC.y + 36)} ${f1(headC.x - 28)},${f1(headC.y - 34)} ${f1(headC.x)},${f1(headC.y - 36)} Z`;
  const mainSh = [torso].concat(legShapes(near));
  $('clipMain').innerHTML = mainSh.concat([head]).map(p => `<path d="${p}"/>`).join('');
  $('main').innerHTML = figure(mainSh, 'clipMain') + figure([head], 'clipMain');

  // muscles (clippés dans la silhouette)
  const q = belly(near.hip, near.knee, .12, .92, -10, 17);
  const hm = belly(near.hip, near.knee, .1, .84, 14, 12);
  const gC = add(add(H, mul(TN, 26)), mul(TD, 18));
  const gl = `M${P(add(gC, V(-46, -8)))} C${P(add(gC, V(-48, -44)))} ${P(add(gC, V(30, -48)))} ${P(add(gC, V(46, -10)))} C${P(add(gC, V(56, 26)))} ${P(add(gC, V(-30, 40)))} ${P(add(gC, V(-46, -8)))} Z`;
  $('mainGlow').innerHTML = muscle(gl, A.glute) + muscle(hm.d, A.ham * .9) + muscle(q.d, A.quad);
  // halo extérieur
  $('aura').innerHTML = auraBlob(q.center, 70, A.quad) + auraBlob(gC, 60, A.glute) + auraBlob(add(fq.center, V(0, 0)), 60, A.farQuad * .6);

  // bras (par-dessus, effilé en pointe)
  const armSh = [capsule(S, elbow, 17, 12), capsule(elbow, hand, 12, 3)];
  $('clipArm').innerHTML = armSh.map(p => `<path d="${p}"/>`).join('');
  $('arm').innerHTML = '';

  $('machineFront').innerHTML = `<g filter="url(#marker)">${M.front}</g>`;

  // traits de mouvement "))" derrière le plateau pendant les poussées, tremblement au genou pendant l'excentrique
  const push = Math.max(smooth(seg(t, T.in, T.in + .2)) * (1 - smooth(seg(t, T.push1 - .2, T.push1 + .1))),
                        smooth(seg(t, T.push2a, T.push2a + .2)) * (1 - smooth(seg(t, T.push2b - .2, T.push2b + .1))));
  let mo = '';
  if (push > .01) {
    const base = add(M.C, mul(U, 60));
    [0, 1].forEach(i => {
      const c = add(add(base, mul(U, 26 * i)), mul(PL, 20));
      const a = add(c, mul(PL, 55 - 8 * i)), b = add(c, mul(PL, -55 + 8 * i)), m = add(c, mul(U, 18));
      mo += stroke(`M${P(a)} Q${P(m)} ${P(b)}`, 6, INK, `opacity="${f1(push)}"`);
    });
  }
  if (A.ecc > .01) {
    const kn = near.knee, jit = Math.sin(t * 40) * 2;
    [[-1, 0], [-1, 1], [1, 0], [1, 1]].forEach(([sg, i]) => {
      const c = add(kn, V(sg * (52 + 16 * i) + jit, -10));
      mo += stroke(`M${P(add(c, V(0, -20 + 4 * i)))} Q${P(add(c, V(sg * 9, 0)))} ${P(add(c, V(0, 20 - 4 * i)))}`, 5, INK, `opacity="${f1(A.ecc)}"`);
    });
  }
  $('motion').innerHTML = `<g filter="url(#marker)">${mo}</g>`;

  const g = smooth(seg(t, 0, .45)) * (1 - smooth(seg(t, 9.5, 10)));
  $('root').setAttribute('opacity', g.toFixed(3));
}
window.render = render;
const qs = new URLSearchParams(location.search);
if (qs.has('preview')) document.body.classList.add('preview');
if (qs.has('t')) render(parseFloat(qs.get('t')));
</script>
</body>
</html>
