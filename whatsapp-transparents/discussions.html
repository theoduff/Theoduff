<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Discussions WhatsApp D1</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--wa-bg:#0B141A;--wa-in:#202C33;--wa-head:#1F2C34;--wa-mute:#8696A0;--green:#25D366;--red:#E30613}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent;font-family:Inter,sans-serif;color:#E9EDEF}
  .wrap{padding:40px;display:inline-block}
  .chat{width:1000px;background:var(--wa-bg);border-radius:40px;overflow:hidden;border:2px solid rgba(255,255,255,.08);
    box-shadow:0 24px 50px rgba(0,0,0,.35);
    background-image:radial-gradient(rgba(255,255,255,.035) 2px,transparent 2.5px);background-size:34px 34px}
  .head{background:var(--wa-head);padding:24px 30px;display:flex;align-items:center;gap:20px}
  .back{width:22px;height:22px;border-left:4px solid #AEBAC1;border-bottom:4px solid #AEBAC1;transform:rotate(45deg);margin:0 4px 0 8px}
  .av{width:68px;height:68px;border-radius:50%;background:var(--red);display:grid;place-items:center;font:700 26px Inter;color:#fff}
  .head .n{flex:1}.head b{font:600 32px/1.1 Inter;display:block}
  .head small{font:400 22px/1.3 Inter;color:var(--wa-mute)}
  .ic{display:flex;gap:34px;align-items:center}
  .ic svg{width:40px;height:40px;fill:#AEBAC1}
  .body{padding:26px 30px 30px;display:flex;flex-direction:column;gap:14px}
  .chip{align-self:center;background:#182229;color:var(--wa-mute);font:500 21px/1 Inter;padding:10px 18px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em;margin:6px 0}
  .msg{max-width:80%;background:var(--wa-in);border-radius:4px 20px 20px 20px;padding:14px 22px 12px;font:400 34px/1.32 Inter;align-self:flex-start}
  .msg.cont{border-radius:20px;margin-top:-6px}
  .who{font:600 24px/1 Inter;margin-bottom:8px;display:block}
  .t{display:block;text-align:right;font:400 19px/1 Inter;color:var(--wa-mute);margin-top:6px}
  .info{align-self:flex-start;font:500 23px/1 Inter;color:var(--wa-mute);padding-left:8px}
  .voice{display:flex;align-items:center;gap:20px;padding:8px 0}
  .voice .play{width:0;height:0;border:17px solid transparent;border-left:28px solid #D1D7DB;border-right:0}
  .wave{display:flex;gap:5px;align-items:center;height:52px}
  .wave i{width:6px;background:var(--wa-mute);border-radius:3px;display:block}.wave i.on{background:#53BDEB}
  .vav{width:68px;height:68px;border-radius:50%;background:#6A7B8C;display:grid;place-items:center;font:700 26px Inter;position:relative}
  .vav::after{content:"🎤";position:absolute;right:-8px;bottom:-6px;font-size:24px}
  .compose{display:flex;gap:16px;align-items:center;padding:0 22px 24px}
  .field{flex:1;background:#2A3942;border-radius:999px;padding:24px 30px;font:400 30px/1 Inter;color:var(--wa-mute);display:flex;justify-content:space-between}
  .mic{width:84px;height:84px;border-radius:50%;background:#00A884;display:grid;place-items:center}
  .mic svg{width:40px;height:40px;fill:#fff}
</style></head><body><div id="root"></div>
<script>
const C={Coach:'#F5A623',Jordan:'#53BDEB',Mehdi:'#25D366','Charles 🧤':'#FF7AB6','Le Président':'#C4A1FF',Ryan:'#FF8A65','Théo':'#7FE0D1'};
let last=null;
const m=(who,txt,t)=>{const cont=last===who;last=who;return `<div class="msg${cont?' cont':''}">${cont?'':`<span class="who" style="color:${C[who]}">${who}</span>`}${txt}<span class="t">${t}</span></div>`};
const chip=t=>{last=null;return `<div class="chip">${t}</div>`};
const info=t=>{last=null;return `<div class="info">${t}</div>`};
const icons=`<div class="ic"><svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11z"/></svg><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></div>`;
const chat=(id,body)=>`<div class="wrap" id="${id}"><div class="chat">
 <div class="head"><div class="back"></div><div class="av">D1</div><div class="n"><b>D1 ⚽ OFFICIEL</b><small>Coach, Charles, Jordan, Mehdi, Ryan, Théo, +16</small></div>${icons}</div>
 <div class="body">${body}</div>
 <div class="compose"><div class="field"><span>😊&nbsp; Message</span><span>📎 📷</span></div><div class="mic"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v7a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12z"/></svg></div></div>
</div></div>`;
const wave=(n,on)=>'<div class="wave">'+Array.from({length:n},(_,k)=>`<i class="${k<on?'on':''}" style="height:${12+((k*37)%38)}px"></i>`).join('')+'</div>';
const D=[];
D.push(chat('rdv', chip('Dimanche')+m('Coach','RDV 13h15 au stade.','10:02')+m('Coach','13h15, ça veut dire 13h15.','10:02')+m('Jordan','Je suis devant la boulangerie, j\'arrive.','13:38')+m('Théo','Quelqu\'un a le code du portail ?','13:41')));
D.push(chat('retardataire', chip('Dimanche')+m('Charles 🧤','Commencez sans moi, j\'arrive.','14:52')+m('Coach','Charles, le match est à 15h.','14:53')+m('Charles 🧤','je sais.','14:58')));
D.push(chat('protege-tibia', chip('14 septembre 2024')+m('Ryan','Quelqu\'un a vu mon protège-tibia gauche ?','17:20')+chip('3 octobre 2025')+m('Ryan','Quelqu\'un a vu mon protège-tibia gauche ?','16:58')+chip('Hier')+m('Ryan','Quelqu\'un a vu mon protège-tibia gauche ?','17:05')));
D.push(chat('sac-maillots', chip('Samedi')+m('Coach','Qui ramène le sac des maillots demain ?','21:15')+info('👁 Vu par 18 · 0 réponse')+chip('Dimanche')+m('Coach','Bon. Je le ramène.','09:47')));
D.push(chat('vocal-president', chip('Mardi')+(last=null,`<div class="msg" style="width:84%"><span class="who" style="color:${C['Le Président']}">Le Président</span><div class="voice"><div class="play"></div>${wave(32,2)}<div class="vav">P</div></div><span class="t" style="display:flex;justify-content:space-between"><span>0:07 / 6:47</span><span>21:12</span></span></div>`)+m('Jordan','Résumé svp ?','21:13')+m('Mehdi','Loto du club, buvette, licences je crois.','21:19')));
D.push(chat('licences', chip('Septembre')+m('Le Président','Pensez à payer votre licence 🙏','19:00')+chip('Octobre')+m('Le Président','Petit rappel pour les licences 🙏🙏','19:00')+chip('Novembre')+m('Le Président','Les gars. Les licences.','19:00')+chip('Aujourd\'hui')+m('Le Président','Petit rappel : pensez à payer votre licence 🙏😊','19:00')));
document.getElementById('root').innerHTML=D.join('');
</script></body></html>
