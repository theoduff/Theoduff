<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Antonelli Classement 2026</title>
<style>
  @font-face { font-family: "InterL"; src: url("file:///usr/share/fonts/opentype/inter/Inter-ExtraLight.otf"); font-weight: 200; }
  @font-face { font-family: "InterL"; src: url("file:///usr/share/fonts/opentype/inter/Inter-Medium.otf"); font-weight: 500; }
  @font-face { font-family: "InterL"; src: url("file:///usr/share/fonts/opentype/inter/Inter-SemiBold.otf"); font-weight: 600; }
  html, body { margin: 0; background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, FPS = 30, DURATION = 6.0;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---- data: 2026 drivers' standings ----
const ROWS = [
  { name: 'K. ANTONELLI', team: 'MERCEDES', pts: 365, me: true },
  { name: 'G. RUSSELL',   team: 'MERCEDES', pts: 242 },
  { name: 'L. HAMILTON',  team: 'FERRARI',  pts: 241 },
  { name: 'M. VERSTAPPEN', team: 'RED BULL', pts: 236 },
  { name: 'C. LECLERC',   team: 'FERRARI',  pts: 233 },
];
const WINS = 9;
const LEAD = ROWS[0].pts - ROWS[1].pts;   // 123

// ---- layout ----
const COUNTER_Y = 640;          // baseline of the big counters
const TITLE_Y = 790;
const ROW_Y0 = 860, ROW_H = 120;
const X_RANK = 90, X_NAME = 240, X_PTS = 990;
const BAR_MAX = 570;            // bar length for the leader
const AV_R = 40;

// ---- timing (seconds) ----
const T = {
  countersIn: [0.0, 0.6],
  wins: [0.6, 2.4],
  rowsIn: 0.3,                  // + i * 0.08
  bars: 0.8,                    // + i * 0.1, each lasts 1.4s
  highlight: [2.6, 3.0],
  gap: [2.8, 3.8],
};

// ---- easing ----
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, [a, b]) => clamp((t - a) / (b - a));
const eOutCubic = t => 1 - Math.pow(1 - t, 3);
const eInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eOutExpo = t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
const eOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

const avatar = new Image();
avatar.src = 'antonelli.png';

const WHITE = a => `rgba(255,255,255,${a})`;

function drawRing(x, y, p, maxR, alpha) {
  if (p <= 0 || p >= 1) return;
  const e = eOutCubic(p);
  ctx.beginPath();
  ctx.arc(x, y, lerp(4, maxR, e), 0, Math.PI * 2);
  ctx.strokeStyle = WHITE(alpha * (1 - p));
  ctx.lineWidth = lerp(2, 0.75, e);
  ctx.stroke();
}

function counter(x, value, label, a) {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '200 140px InterL'; ctx.letterSpacing = '0px';
  ctx.fillStyle = WHITE(a);
  ctx.fillText(value, x, COUNTER_Y + (1 - a) * 16);
  ctx.font = '600 15px InterL'; ctx.letterSpacing = '6px';
  ctx.fillStyle = WHITE(0.75 * a);
  ctx.fillText(label, x + 3, COUNTER_Y + 50);
}

function render(t) {
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = 'round';

  // ---------- big counters ----------
  const cIn = eOutCubic(prog(t, T.countersIn));
  if (cIn > 0) {
    const wins = Math.round(WINS * eInOutCubic(prog(t, T.wins)));
    const lead = Math.round(LEAD * eOutCubic(prog(t, T.gap)));
    counter(W * 0.3, String(wins), 'VICTOIRES', cIn);
    counter(W * 0.7, '+' + lead, "PTS D'AVANCE", cIn);
    // thin vertical divider
    ctx.beginPath();
    ctx.moveTo(W / 2, COUNTER_Y - 100 * cIn); ctx.lineTo(W / 2, COUNTER_Y + 40 * cIn);
    ctx.strokeStyle = WHITE(0.3 * cIn); ctx.lineWidth = 1; ctx.stroke();
  }

  // ---------- title ----------
  const tIn = eOutCubic(prog(t, [0.2, 0.7]));
  if (tIn > 0) {
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.font = '600 15px InterL'; ctx.letterSpacing = '6px';
    ctx.fillStyle = WHITE(0.75 * tIn);
    ctx.fillText('CLASSEMENT PILOTES · 2026', X_RANK, TITLE_Y);
    ctx.beginPath(); ctx.moveTo(X_RANK, TITLE_Y + 22);
    ctx.lineTo(lerp(X_RANK, X_PTS, eOutExpo(tIn)), TITLE_Y + 22);
    ctx.strokeStyle = WHITE(0.28); ctx.lineWidth = 1.5; ctx.stroke();
  }

  const hl = eOutCubic(prog(t, T.highlight));

  // ---------- rows ----------
  const barEnd = [];
  ROWS.forEach((r, i) => {
    const y = ROW_Y0 + i * ROW_H;
    const ri = eOutCubic(clamp((t - (T.rowsIn + i * 0.08)) / 0.5));
    const b = eInOutCubic(clamp((t - (T.bars + i * 0.1)) / 1.4));
    const len = BAR_MAX * (r.pts / ROWS[0].pts) * b;
    barEnd[i] = X_NAME + BAR_MAX * (r.pts / ROWS[0].pts);
    if (ri <= 0) return;

    const dim = r.me ? 1 : lerp(1, 0.55, hl);
    const dy = (1 - ri) * 14;
    const lineY = y + 52 + dy;

    // rank
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.font = '500 15px InterL'; ctx.letterSpacing = '3px';
    ctx.fillStyle = WHITE((r.me ? 1 : 0.55) * ri * dim);
    ctx.fillText(String(i + 1).padStart(2, '0'), X_RANK, y + 26 + dy);

    // name + team
    ctx.font = `${r.me ? 600 : 500} 19px InterL`; ctx.letterSpacing = '4px';
    ctx.fillStyle = WHITE((r.me ? 1 : 0.85) * ri * dim);
    ctx.fillText(r.name, X_NAME, y + 26 + dy);
    const nameW = ctx.measureText(r.name).width;
    ctx.font = '500 13px InterL'; ctx.letterSpacing = '3px';
    ctx.fillStyle = WHITE(0.45 * ri * dim);
    ctx.fillText(r.team, X_NAME + nameW + 14, y + 26 + dy);

    // points (count up with the bar)
    ctx.textAlign = 'right';
    ctx.font = `${r.me ? 600 : 500} 22px InterL`; ctx.letterSpacing = '2px';
    ctx.fillStyle = WHITE((r.me ? 1 : 0.85) * ri * dim);
    ctx.fillText(String(Math.round(r.pts * b)), X_PTS, y + 28 + dy);
    ctx.font = '500 12px InterL'; ctx.letterSpacing = '3px';
    ctx.fillStyle = WHITE(0.45 * ri * dim);
    ctx.fillText('PTS', X_PTS, y + 48 + dy);

    // track
    ctx.beginPath();
    ctx.moveTo(X_NAME, lineY); ctx.lineTo(X_NAME + BAR_MAX * ri, lineY);
    ctx.strokeStyle = WHITE(0.14 * dim); ctx.lineWidth = 1.5; ctx.stroke();

    // bar (gauge)
    if (len > 0) {
      ctx.save();
      if (r.me) { ctx.shadowColor = WHITE(0.9); ctx.shadowBlur = lerp(4, 12, hl); }
      ctx.beginPath(); ctx.moveTo(X_NAME, lineY); ctx.lineTo(X_NAME + len, lineY);
      ctx.strokeStyle = WHITE(r.me ? 1 : 0.6 * dim);
      ctx.lineWidth = r.me ? 3 : 2; ctx.stroke();
      // head dot
      ctx.beginPath(); ctx.arc(X_NAME + len, lineY, r.me ? 5 : 3, 0, Math.PI * 2);
      ctx.fillStyle = WHITE(r.me ? 1 : 0.7 * dim); ctx.fill();
      ctx.restore();
    }

    // avatar for the leader, left of the name
    if (r.me) {
      const s = eOutBack(clamp((t - 0.35) / 0.5));
      if (s > 0) {
        const ax = X_RANK + 82, ay = y + 32 + dy;
        ctx.save();
        ctx.translate(ax, ay); ctx.scale(s, s);
        ctx.beginPath(); ctx.arc(0, 0, AV_R, 0, Math.PI * 2);
        ctx.save(); ctx.clip();
        ctx.drawImage(avatar, -AV_R, -AV_R, AV_R * 2, AV_R * 2);
        ctx.restore();
        ctx.lineWidth = 2; ctx.strokeStyle = WHITE(1); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, AV_R + 6, 0, Math.PI * 2);
        ctx.lineWidth = 1; ctx.strokeStyle = WHITE(0.35); ctx.stroke();
        ctx.restore();
        drawRing(ax, ay, prog(t, [T.highlight[0], T.highlight[0] + 0.8]), 80, 0.8);
      }
    }
  });

  // ---------- gap bracket: Russell's bar end -> Antonelli's bar end ----------
  const g = eInOutCubic(prog(t, T.gap));
  if (g > 0) {
    const y1 = ROW_Y0 + 52, y2 = ROW_Y0 + ROW_H + 52;
    const xa = barEnd[1], xb = barEnd[0];
    ctx.save();
    ctx.setLineDash([0.01, 8]); ctx.lineCap = 'round';
    ctx.lineWidth = 2.4; ctx.strokeStyle = WHITE(0.8);
    // horizontal: extend Russell's line to the leader's mark
    ctx.beginPath(); ctx.moveTo(xa, y2); ctx.lineTo(lerp(xa, xb, clamp(g * 1.5)), y2); ctx.stroke();
    // vertical: drop from the leader's bar
    const v = clamp(g * 1.5 - 0.5);
    if (v > 0) { ctx.beginPath(); ctx.moveTo(xb, y1 + 8); ctx.lineTo(xb, lerp(y1 + 8, y2, v)); ctx.stroke(); }
    ctx.restore();

    const la = eOutCubic(clamp((t - T.gap[0] - 0.5) / 0.4));
    if (la > 0) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.font = '600 16px InterL'; ctx.letterSpacing = '3px';
      ctx.fillStyle = WHITE(la);
      ctx.fillText('+' + LEAD, (xa + xb) / 2 + 1.5, y2 - 16 + (1 - la) * 6);
    }
  }
}

window.ready = Promise.all([
  new Promise(r => avatar.complete ? r() : (avatar.onload = r)),
  document.fonts.load('200 140px InterL'),
  document.fonts.load('500 19px InterL'),
  document.fonts.load('600 19px InterL'),
]);
window.renderFrame = i => { render(i / FPS); return cv.toDataURL('image/png'); };
window.META = { FPS, DURATION, W, H };

// live preview when opened in a browser
if (!navigator.webdriver) {
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = now => { render(((now - t0) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
