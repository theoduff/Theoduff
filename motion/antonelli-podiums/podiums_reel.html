<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Antonelli Podiums</title>
<style>
  @font-face { font-family: "InterL"; src: url("file:///usr/share/fonts/opentype/inter/Inter-ExtraLight.otf"); font-weight: 200; }
  @font-face { font-family: "InterL"; src: url("file:///usr/share/fonts/opentype/inter/Inter-Medium.otf"); font-weight: 500; }
  @font-face { font-family: "InterL"; src: url("file:///usr/share/fonts/opentype/inter/Inter-SemiBold.otf"); font-weight: 600; }
  html, body { margin: 0; background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, FPS = 30, DURATION = 6.0;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---- layout ----
const LINE_Y = 1080;
const X0 = 90, XEND = 990;
// 2025 season podiums
const STOPS = [
  { label: 'CANADA',    pos: 3, x: 300, move: [0.3, 1.4] },
  { label: 'SÃO PAULO', pos: 2, x: 560, move: [1.9, 2.9] },
  { label: 'LAS VEGAS', pos: 3, x: 820, move: [3.4, 4.3] },
];
const AV_R = 68;          // avatar radius
const STEM = 44;          // stem length between dot and avatar
const COUNTER_Y = 780;    // baseline of the big podium counter

// ---- timing (seconds) ----
const T = {
  trackIn: [0.0, 0.9],
  avatarIn: [0.05, 0.55],
  counterIn: [0.2, 0.8],
};

// ---- easing ----
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, [a, b]) => clamp((t - a) / (b - a));
const eOutCubic = t => 1 - Math.pow(1 - t, 3);
const eInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eOutExpo = t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
const eOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
// damped spring 0 -> 1
const spring = (t, freq = 3.2, damp = 6) => 1 - Math.exp(-damp * t) * Math.cos(freq * 2 * Math.PI * t);

const avatar = new Image();
avatar.src = 'antonelli.png';

const WHITE = a => `rgba(255,255,255,${a})`;

function drawRing(x, y, p, maxR, alpha) {
  if (p <= 0 || p >= 1) return;
  const e = eOutCubic(p);
  ctx.beginPath();
  ctx.arc(x, y, lerp(4, maxR, e), 0, Math.PI * 2);
  ctx.strokeStyle = WHITE(alpha * (1 - p));
  ctx.lineWidth = lerp(2, 0.75, e);
  ctx.stroke();
}

// three-step podium outline; the driver's step fills in
function drawPodium(x, y, pos, p) {
  if (p <= 0) return;
  const sw = 26;
  const steps = [ // left = P2, centre = P1, right = P3
    { n: 2, dx: -sw * 1.5, h: 24 },
    { n: 1, dx: -sw * 0.5, h: 36 },
    { n: 3, dx: sw * 0.5,  h: 15 },
  ];
  steps.forEach((s, i) => {
    const grow = eOutCubic(clamp(p * 1.6 - i * 0.2));
    if (grow <= 0) return;
    const h = s.h * grow;
    const mine = s.n === pos;
    if (mine) {
      ctx.fillStyle = WHITE(grow);
      ctx.fillRect(x + s.dx, y - h, sw, h);
    }
    ctx.strokeStyle = WHITE(mine ? 1 : 0.55 * grow);
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x + s.dx + 0.75, y - h + 0.75, sw - 1.5, h - 1.5);
  });
}

function render(t) {
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = 'round';

  // ---------- track ----------
  const tr = eOutExpo(prog(t, T.trackIn));
  const trackX = lerp(X0, XEND, tr);
  ctx.beginPath();
  ctx.moveTo(X0, LINE_Y); ctx.lineTo(trackX, LINE_Y);
  ctx.strokeStyle = WHITE(0.28); ctx.lineWidth = 1.5; ctx.stroke();
  if (tr > 0) {
    ctx.beginPath(); ctx.arc(X0, LINE_Y, 3, 0, Math.PI * 2);
    ctx.fillStyle = WHITE(0.5 * clamp(tr * 4)); ctx.fill();
  }
  // end tick (end of season)
  if (tr > 0.98) {
    ctx.beginPath(); ctx.moveTo(XEND, LINE_Y - 8); ctx.lineTo(XEND, LINE_Y + 8);
    ctx.strokeStyle = WHITE(0.45); ctx.lineWidth = 1.5; ctx.stroke();
  }

  // ---------- runner position (gauge glides between podiums) ----------
  let px = X0, arrived = -1, landT = 0;
  STOPS.forEach((s, i) => {
    const from = i === 0 ? X0 : STOPS[i - 1].x;
    if (t >= s.move[0]) px = lerp(from, s.x, eInOutCubic(prog(t, s.move)));
    if (t >= s.move[1]) { arrived = i; landT = t - s.move[1]; }
  });

  // gauge
  if (px > X0) {
    ctx.save();
    ctx.shadowColor = WHITE(0.9); ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(X0, LINE_Y); ctx.lineTo(px, LINE_Y);
    ctx.strokeStyle = WHITE(1); ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  }

  // ---------- stops ----------
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  STOPS.forEach((s, i) => {
    const appear = clamp((trackX - s.x + 60) / 60);
    if (appear <= 0) return;
    const appearE = eOutCubic(clamp((t - (0.25 + i * 0.09)) / 0.5));
    const lit = eOutCubic(clamp((t - s.move[1]) / 0.25));

    const tickH = lerp(8, 14, lit) * appear;
    ctx.beginPath();
    ctx.moveTo(s.x, LINE_Y - tickH); ctx.lineTo(s.x, LINE_Y + tickH);
    ctx.strokeStyle = WHITE(lerp(0.45, 1, lit) * appear);
    ctx.lineWidth = lerp(1.5, 2.5, lit);
    ctx.stroke();
    if (lit > 0) {
      ctx.beginPath(); ctx.arc(s.x, LINE_Y, 5 * lit, 0, Math.PI * 2);
      ctx.fillStyle = WHITE(1); ctx.fill();
    }

    const ly = LINE_Y + 34 + (1 - appearE) * 10;
    ctx.font = `${lit > 0.5 ? 600 : 500} 19px InterL`;
    ctx.letterSpacing = '4px';
    ctx.fillStyle = WHITE(appearE * lerp(0.5, 1, lit));
    ctx.fillText(s.label, s.x + 2, ly);

    // podium glyph + position, revealed on arrival
    const pp = clamp((t - s.move[1] - 0.05) / 0.6);
    drawPodium(s.x, ly + 82, s.pos, pp);
    const pe = eOutCubic(clamp((t - s.move[1] - 0.25) / 0.4));
    if (pe > 0) {
      ctx.font = '600 16px InterL'; ctx.letterSpacing = '3px';
      ctx.fillStyle = WHITE(pe);
      ctx.fillText('P' + s.pos, s.x + 1.5, ly + 96 + (1 - pe) * 8);
    }
  });

  // ---------- rings ----------
  STOPS.forEach(s => {
    drawRing(s.x, LINE_Y, prog(t, [s.move[1], s.move[1] + 0.8]), 70, 1.0);
    drawRing(s.x, LINE_Y, prog(t, [s.move[1] + 0.1, s.move[1] + 1.0]), 110, 0.5);
  });

  // ---------- podium counter ----------
  const cIn = eOutCubic(prog(t, T.counterIn));
  if (cIn > 0) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '600 15px InterL'; ctx.letterSpacing = '6px';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = WHITE(0.75 * cIn);
    ctx.fillText('PODIUMS · SAISON 2025', W / 2 + 3, COUNTER_Y - 150 + (1 - cIn) * 10);

    // rolling digit, clipped to its own window
    const count = arrived + 1;
    const roll = arrived >= 0 ? eOutExpo(clamp(landT / 0.45)) : 1;
    ctx.beginPath(); ctx.rect(W / 2 - 120, COUNTER_Y - 116, 240, 126); ctx.clip();
    ctx.font = '200 150px InterL'; ctx.letterSpacing = '0px';
    ctx.textBaseline = 'alphabetic';
    const step = 150;
    if (count > 0 && roll < 1) {
      ctx.fillStyle = WHITE(cIn * (1 - roll));
      ctx.fillText(String(count - 1), W / 2, COUNTER_Y - roll * step);
    }
    ctx.fillStyle = WHITE(cIn * (count > 0 ? roll : 1));
    ctx.fillText(String(count), W / 2, COUNTER_Y + (count > 0 ? (1 - roll) * step : (1 - cIn) * 20));
    ctx.restore();

    // thin rule under the counter
    ctx.beginPath();
    ctx.moveTo(W / 2 - 40 * cIn, COUNTER_Y + 30); ctx.lineTo(W / 2 + 40 * cIn, COUNTER_Y + 30);
    ctx.strokeStyle = WHITE(0.5 * cIn); ctx.lineWidth = 1.5; ctx.stroke();
  }

  // ---------- runner (dot + stem + avatar) ----------
  let squash = 0;
  if (arrived >= 0 && landT < 0.9 && t < (STOPS[arrived + 1] || { move: [99] }).move[0]) {
    squash = (1 - spring(clamp(landT / 0.7), 2.2, 6)) * -1.1;
  }
  const stem = STEM * (1 - 0.35 * squash);
  const aIn = prog(t, T.avatarIn);
  const aScale = aIn <= 0 ? 0 : eOutBack(aIn);

  ctx.save();
  ctx.shadowColor = WHITE(1); ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.arc(px, LINE_Y, 6 * clamp(aScale * 1.5, 0, 1), 0, Math.PI * 2);
  ctx.fillStyle = WHITE(1); ctx.fill();
  ctx.restore();

  if (aScale > 0) {
    const stemTop = LINE_Y - stem * aScale;
    ctx.beginPath(); ctx.moveTo(px, LINE_Y - 6); ctx.lineTo(px, stemTop);
    ctx.strokeStyle = WHITE(0.9); ctx.lineWidth = 1.5; ctx.stroke();

    const sx = (1 + 0.08 * squash) * aScale, sy = (1 - 0.08 * squash) * aScale;
    const cy = stemTop - AV_R * sy;
    ctx.save();
    ctx.translate(px, cy);
    ctx.scale(sx, sy);
    ctx.beginPath(); ctx.arc(0, 0, AV_R, 0, Math.PI * 2);
    ctx.save(); ctx.clip();
    ctx.drawImage(avatar, -AV_R, -AV_R, AV_R * 2, AV_R * 2);
    ctx.restore();
    ctx.lineWidth = 2.5; ctx.strokeStyle = WHITE(1); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, AV_R + 8, 0, Math.PI * 2);
    ctx.lineWidth = 1; ctx.strokeStyle = WHITE(0.35); ctx.stroke();
    ctx.restore();
  }
}

window.ready = Promise.all([
  new Promise(r => avatar.complete ? r() : (avatar.onload = r)),
  document.fonts.load('200 150px InterL'),
  document.fonts.load('500 19px InterL'),
  document.fonts.load('600 19px InterL'),
]);
window.renderFrame = i => { render(i / FPS); return cv.toDataURL('image/png'); };
window.META = { FPS, DURATION, W, H };

// live preview when opened in a browser
if (!navigator.webdriver) {
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = now => { render(((now - t0) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
