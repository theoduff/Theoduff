<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carrousel messages WhatsApp</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0A1B45;--ink:#06102B;--red:#E30613;--white:#fff;--cream:#F4F1EA;
    --mute:rgba(255,255,255,.62);--line:rgba(255,255,255,.14);
    --wa-bg:#0B141A;--wa-in:#202C33;--wa-out:#005C4B;--wa-mute:#8696A0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#222;font-family:Inter,sans-serif;color:var(--white)}
  .slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--navy);
    padding:72px 80px;display:flex;flex-direction:column;margin:0 auto 40px}
  .slide.red{background:var(--red)}
  .slide::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
    background:radial-gradient(circle at 50% 50%,transparent 238px,var(--line) 239px,var(--line) 242px,transparent 243px),
      linear-gradient(var(--line),var(--line)) 0 50%/100% 3px no-repeat}
  .slide>*{position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;font:700 22px/1 Inter;letter-spacing:.18em;text-transform:uppercase}
  .top .tag{display:flex;align-items:center;gap:14px}
  .top .tag i{width:14px;height:14px;border-radius:50%;background:var(--red);display:block}
  .slide.red .top .tag i{background:var(--white)}
  .top .num{font:400 30px/1 Anton;letter-spacing:.04em;opacity:.8}
  h2{font:400 100px/.95 Anton;text-transform:uppercase;margin-top:44px}
  h2 em{font-style:normal;color:var(--red)}
  .slide.red h2 em{color:var(--ink)}

  /* chat */
  .chat{margin-top:44px;background:var(--wa-bg);border-radius:40px;border:2px solid rgba(255,255,255,.08);
    box-shadow:0 30px 60px rgba(0,0,0,.4);overflow:hidden;display:flex;flex-direction:column}
  .wa-head{background:#1F2C34;padding:22px 30px;display:flex;align-items:center;gap:20px}
  .wa-av{width:60px;height:60px;border-radius:50%;background:var(--red);display:grid;place-items:center;font:400 28px Anton}
  .wa-head b{font:600 28px/1.1 Inter;display:block}
  .wa-head small{font:400 21px/1.3 Inter;color:var(--wa-mute)}
  .wa-body{padding:24px 28px 28px;display:flex;flex-direction:column;gap:14px}
  .chip{align-self:center;background:#182229;color:var(--wa-mute);font:500 18px/1 Inter;padding:8px 16px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em}
  .msg{max-width:80%;background:var(--wa-in);border-radius:18px;padding:14px 20px 12px;font:400 31px/1.3 Inter;align-self:flex-start}
  .msg.me{background:var(--wa-out);align-self:flex-end}
  .msg.small{font-size:26px;padding:10px 18px 9px}
  .msg.big{font-size:40px}
  .who{font:600 22px/1 Inter;margin-bottom:7px;display:block}
  .t{display:block;text-align:right;font:400 18px/1 Inter;color:var(--wa-mute);margin-top:6px}
  .info{align-self:flex-start;font:500 22px/1 Inter;color:var(--wa-mute);padding-left:8px;display:flex;gap:10px;align-items:center}
  .voice{display:flex;align-items:center;gap:18px;padding:6px 0}
  .voice .av{width:62px;height:62px;border-radius:50%;background:#6A7B8C;display:grid;place-items:center;font:400 26px Anton}
  .voice .play{width:0;height:0;border:16px solid transparent;border-left:26px solid #D1D7DB;border-right:0}
  .wave{display:flex;gap:5px;align-items:center;height:48px}
  .wave i{width:6px;background:var(--wa-mute);border-radius:3px;display:block}
  .wave i.on{background:#53BDEB}
  .poll h5{font:600 32px/1.2 Inter;margin-bottom:6px}
  .poll small{font:400 20px Inter;color:var(--wa-mute)}
  .opt{margin-top:18px}
  .opt div{display:flex;justify-content:space-between;font:400 28px/1 Inter;margin-bottom:10px}
  .opt .bar{height:9px;border-radius:5px;background:#374248}
  .opt .bar span{display:block;height:100%;border-radius:5px;background:#25D366}
  .photo{width:560px;height:210px;border-radius:12px;overflow:hidden;position:relative;margin-bottom:10px;
    background:linear-gradient(160deg,#5c6b4f,#2c3a26 60%,#1c241a);}
  .board{position:absolute;left:110px;top:22px;width:340px;height:160px;background:#111;border:10px solid #333;border-radius:6px;
    transform:rotate(-7deg) skewX(-6deg);display:flex;justify-content:space-around;align-items:center;filter:blur(2.2px);
    box-shadow:0 0 40px rgba(255,170,0,.25)}
  .board b{font:400 120px/1 Anton;color:#FFB300;text-shadow:0 0 18px #FF8F00}
  .finger{position:absolute;right:-30px;bottom:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(#d9a07a,#9c6648);filter:blur(10px);opacity:.9}

  /* punchline */
  .punch{margin-top:auto;padding-top:28px;display:flex;gap:26px;align-items:flex-start}
  .punch .arrow{font:400 80px/1 Anton;color:var(--red)}
  .slide.red .punch .arrow{color:var(--ink)}
  .punch p{font:italic 400 52px/1.12 "Instrument Serif"}
  .punch p b{font:400 60px/1.05 Anton;font-style:normal;text-transform:uppercase;display:block;margin-top:6px}
  .punch p b.huge{font-size:150px;line-height:.95;color:var(--red)}

  /* cover */
  .cover h1{font:400 172px/.88 Anton;text-transform:uppercase;margin-top:64px}
  .cover .serif{font:italic 400 104px/1 "Instrument Serif";margin-top:14px}
  .cover .serif em{color:var(--red)}
  .cover .unread{position:absolute;right:80px;bottom:330px;transform:rotate(-5deg);background:#25D366;color:var(--ink);
    border-radius:999px;padding:18px 30px;font:800 34px/1 Inter;box-shadow:0 18px 40px rgba(0,0,0,.35)}
  .stack{margin-top:auto;display:flex;flex-direction:column;gap:14px}
  .stack .msg{font-size:32px}
  .stack .msg:nth-child(1){opacity:.55}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:40px;font:600 22px/1 Inter;letter-spacing:.06em;color:var(--mute)}
  .swipe{display:flex;align-items:center;gap:14px;color:var(--white);font-weight:700}
  .swipe span{display:inline-block;width:64px;height:3px;background:currentColor;position:relative}
  .swipe span::after{content:"";position:absolute;right:-2px;top:-8px;border:9px solid transparent;border-left:14px solid currentColor;border-right:0}

  /* cta */
  .cta h2{font-size:150px;line-height:.9;margin-top:56px}
  .ideas{margin-top:auto;margin-bottom:34px;display:flex;flex-direction:column;gap:14px}
  .ideas .msg{font-size:32px}
  .cta .sub{font:italic 400 48px/1.15 "Instrument Serif";margin-top:30px}
  .compose{display:flex;gap:18px;align-items:center}
  .compose .field{flex:1;background:#2A3942;border-radius:999px;padding:30px 36px;font:400 32px/1 Inter;color:var(--wa-mute)}
  .compose .field b{color:var(--white);font-weight:400}
  .compose .field b::after{content:"";display:inline-block;width:3px;height:36px;background:#25D366;vertical-align:-6px;margin-left:4px}
  .compose .send{width:96px;height:96px;border-radius:50%;background:#25D366;display:grid;place-items:center}
  .compose .send i{width:0;height:0;border:18px solid transparent;border-left:30px solid var(--ink);border-right:0;margin-left:8px}
  .act{display:flex;gap:20px;margin-top:30px}
  .act div{flex:1;background:var(--white);color:var(--ink);border-radius:24px;padding:26px 30px;font:700 30px/1.2 Inter}
  .act div small{display:block;font:italic 400 30px/1.1 "Instrument Serif";color:rgba(6,16,43,.6);margin-top:6px}
  .act div.r{background:var(--red);color:var(--white)}
  .act div.r small{color:rgba(255,255,255,.8)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const C={coach:'#F5A623',jordan:'#53BDEB',mehdi:'#25D366',seb:'#FF7AB6',pres:'#C4A1FF',kevin:'#FFD54F',theo:'#7FE0D1',ryan:'#FF8A65'};
const head=(sub)=>`<div class="wa-head"><div class="wa-av">B</div><div><b>Séniors B ⚽ OFFICIEL</b><small>${sub||'Coach, Jordan, Mehdi, Seb, Kévin, +17'}</small></div></div>`;
const m=(who,txt,t,cls='')=>`<div class="msg ${cls}">${who?`<span class="who" style="color:${C[who[0]]}">${who[1]}</span>`:''}${txt}<span class="t">${t}</span></div>`;
const me=(txt,t,cls='')=>`<div class="msg me ${cls}">${txt}<span class="t">${t} ✓✓</span></div>`;
const chip=t=>`<div class="chip">${t}</div>`;
const wave=(n,on=0)=>'<div class="wave">'+Array.from({length:n},(_,k)=>`<i class="${k<on?'on':''}" style="height:${10+((k*37)%34)}px"></i>`).join('')+'</div>';
const chat=(body,sub)=>`<div class="chat">${head(sub)}<div class="wa-body">${body}</div></div>`;
const topbar=(tag,n)=>`<div class="top"><div class="tag"><i></i>${tag}</div><div class="num">${String(n).padStart(2,'0')}/12</div></div>`;
const slide=(n,title,body,punch,cls='')=>`<section class="slide ${cls}" id="s${n}">${topbar('Message n°'+(n-1),n)}<h2>${title}</h2>${body}<div class="punch"><div class="arrow">→</div><p>${punch}</p></div></section>`;

const S=[];
// 1 cover
S.push(`<section class="slide cover" id="s1">${topbar('Football amateur',1)}
  <div class="unread">143 messages non lus</div>
  <h1>Les<br>meilleurs<br>messages</h1>
  <div class="serif">des groupes WhatsApp<br><em>de foot amateur</em></div>
  <div class="stack">
    ${m(['jordan','Jordan'],'J\'arrive dans 5 min','13:38')}
    ${m(['pres','Le Président'],'🎤 Message vocal · 6:47','21:12')}
  </div>
  <div class="foot"><span>On les a tous reçus. Certains les ont envoyés.</span><span class="swipe">Glisse <span></span></span></div>
</section>`);
// 2 recensement (poll)
S.push(slide(2,'Le recensement <em>du jeudi</em>',chat(
  chip('Jeudi')+m(['coach','Coach'],'Il me faut 11 noms avant ce soir 🙏 Répondez SVP','18:04')+
  `<div class="msg" style="width:80%"><span class="who" style="color:${C.coach}">Coach</span><div class="poll"><h5>Dispo dimanche 15h ?</h5><small>Sélectionnez une option</small>
   <div class="opt"><div><span>Oui</span><span>4</span></div><div class="bar"><span style="width:40%"></span></div></div>
   <div class="opt"><div><span>Peut-être</span><span>3</span></div><div class="bar"><span style="width:30%"></span></div></div>
   <div class="opt"><div><span>Je vous redis</span><span>1</span></div><div class="bar"><span style="width:10%"></span></div></div></div><span class="t">18:05</span></div>`),
  'Vendredi, 22h.<b>Toujours 4 noms.</b>'));
// 3 cousin
S.push(slide(3,'L\'appel <em>au secours</em>',chat(
  chip('Samedi')+m(['coach','Coach'],'On est 9. Quelqu\'un a un cousin ? Un voisin ? N\'importe qui ?','19:47')+
  m(['mehdi','Mehdi'],'Mon cousin peut venir','20:31')+m(['coach','Coach'],'Il a des crampons ?','20:31')+m(['mehdi','Mehdi'],'Il a des Stan Smith','20:33')),
  'Le cousin a joué en Stan Smith.<b>Il a marqué un doublé.</b>'));
// 4 rdv
S.push(slide(4,'Le rendez-<em>vous</em>',chat(
  chip('Dimanche')+m(['coach','Coach'],'RDV 13h15 au stade.','10:02')+m(['coach','Coach'],'13h15 ça veut dire 13h15.','10:02','big')+
  m(['jordan','Jordan'],'J\'suis devant la boulangerie j\'arrive','13:38')+m(['theo','Théo'],'Qqn a le code du portail ?','13:41')),
  'Depuis la création du club,<b>personne n\'est jamais arrivé à 13h15.</b>'));
// 5 gardien
S.push(slide(5,'Le <em>retardataire</em>',chat(
  chip('Dimanche')+m(['seb','Seb 🧤'],'Commencez sans moi j\'arrive 🏃‍♂️','14:52','big')+m(['coach','Coach'],'Seb le match est à 15h','14:53')+m(['seb','Seb 🧤'],'Je sais','14:58')),
  'Petit détail :<b class="huge">c\'est le gardien.</b>'));
// 6 protège-tibia
S.push(slide(6,'L\'objet <em>perdu</em>',chat(
  chip('14 septembre 2024')+m(['ryan','Ryan'],'Quelqu\'un a vu mon protège-tibia gauche ?','17:20')+
  chip('3 octobre 2025')+m(['ryan','Ryan'],'Quelqu\'un a vu mon protège-tibia gauche ?','16:58')+
  chip('Hier')+m(['ryan','Ryan'],'Quelqu\'un a vu mon protège-tibia gauche ?','17:05')),
  'Trois saisons de recherches.<b>Toujours aucune piste.</b>'));
// 7 maillots
S.push(slide(7,'Le sac des <em>maillots</em>',chat(
  chip('Samedi')+m(['coach','Coach'],'Qui ramène le sac des maillots demain ?','21:15','big')+
  `<div class="info">👁 Vu par 18 · 0 réponse</div>`+chip('Dimanche')+m(['coach','Coach'],'Bon. Je le ramène.','09:47')),
  'Comme la semaine dernière.<b>Et celle d\'avant.</b>'));
// 8 score
S.push(slide(8,'La photo <em>du score</em>',chat(
  chip('Dimanche')+`<div class="msg"><span class="who" style="color:${C.kevin}">Kévin</span><div class="photo"><div class="board"><b>3</b><b>3</b></div><div class="finger"></div></div><span style="font:800 40px Inter">ON EST LÀ 🔥🔥🔥</span><span class="t">16:52</span></div>`+
  m(['theo','Théo'],'On a gagné ??','16:53','small')+m(['kevin','Kévin'],'Moralement oui','16:53','small')),
  'Score final : 3-3.<b>Dans le groupe, c\'est une victoire.</b>'));
// 9 président
S.push(slide(9,'Le vocal du <em>président</em>',chat(
  chip('Mardi')+`<div class="msg" style="width:84%"><span class="who" style="color:${C.pres}">Le Président</span><div class="voice"><div class="play"></div>${wave(30,2)}<div class="av">P</div></div><span class="t" style="display:flex;justify-content:space-between"><span>0:07 / 6:47</span><span>21:12</span></span></div>`+
  m(['jordan','Jordan'],'Résumé svp ?','21:13')+m(['mehdi','Mehdi'],'Loto du club, buvette, licences je crois','21:19')),
  'Écouté jusqu\'au bout par :<b class="huge">0 personne.</b>'));
// 10 licences
S.push(slide(10,'Les <em>licences</em>',chat(
  chip('Septembre')+m(['pres','Le Président'],'Pensez à payer votre licence 🙏','19:00','small')+
  chip('Octobre')+m(['pres','Le Président'],'Petit rappel pour les licences 🙏🙏','19:00','small')+
  chip('Novembre')+m(['pres','Le Président'],'Les gars. Les licences.','19:00','small')+
  chip('Aujourd\'hui')+m(['pres','Le Président'],'Petit rappel : la licence 🙏😊','19:00')),
  '4<sup style="font-size:.5em">e</sup> relance.<b>Toujours la plus polie.</b>'));
// 11 anniversaire
S.push(slide(11,'L\'anniv\' <em>de Kévin</em>',chat(
  chip('Aujourd\'hui')+m(['coach','Coach'],'Joyeux anniversaire Kévin ! 🎉🎂','08:01')+
  m(['jordan','Jordan'],'Joyeux anniv frérot','08:03','small')+m(['mehdi','Mehdi'],'Joyeux anniv frérot','08:03','small')+
  
  `<div class="chip">+ 20 messages identiques</div>`+m(['kevin','Kévin'],'👍','23:58','big')),
  '22 messages copiés-collés.<b>Un pouce en réponse.</b>','red'));
// 12 CTA
S.push(`<section class="slide cta" id="s12">${topbar('Football amateur',12)}
  <h2>Et dans<br>ton groupe <em>?</em></h2>
  <p class="sub">C'est quoi le message culte ? Celui que tout le monde ressort encore.</p>
  <div class="ideas">${m(['jordan','Jordan'],'Je suis malade mais je viens','14:02')}${m(['mehdi','Mehdi'],'Qui a les clés du local ?','14:31')}</div>
  <div class="compose"><div class="field"><b>Raconte-le en commentaire</b></div><div class="send"><i></i></div></div>
  <div class="act"><div class="r">Identifie l'auteur 👇<small>Il sait ce qu'il a fait.</small></div><div>Partage dans ton groupe<small>Ils vont se reconnaître.</small></div></div>
</section>`);
document.getElementById('root').innerHTML=S.join('');
</script>
</body>
</html>
