<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@300;400&display=block" rel="stylesheet">
<style>
html,body{margin:0}
body{width:var(--w);height:var(--h);overflow:hidden}
.c{position:relative;width:100%;height:100%;
 background:
  radial-gradient(120% 80% at 18% 8%, #ffffff 0%, rgba(255,255,255,0) 55%),
  radial-gradient(90% 70% at 100% 100%, #ece7df 0%, rgba(236,231,223,0) 60%),
  linear-gradient(160deg,#fbfaf7 0%,#f5f2ec 60%,#efebe4 100%);}
/* soft window-light shadows */
.shade{position:absolute;inset:-20%;filter:blur(38px);opacity:.42;transform:rotate(-24deg);
 background:repeating-linear-gradient(90deg, rgba(150,138,120,.0) 0 120px, rgba(150,138,120,.22) 120px 150px);
 -webkit-mask-image:radial-gradient(60% 55% at 85% 20%, #000 0%, transparent 75%);
         mask-image:radial-gradient(60% 55% at 85% 20%, #000 0%, transparent 75%);}
.leaf{position:absolute;right:-60px;top:-40px;width:520px;opacity:.10;filter:blur(10px)}
.grain{position:absolute;inset:0;opacity:.32;mix-blend-mode:multiply}
.frame{position:absolute;inset:44px;border:1px solid rgba(40,36,30,.16)}
.top,.bot{position:absolute;left:0;right:0;display:flex;justify-content:space-between;padding:0 78px;
 font:400 15px/1 Inter,sans-serif;letter-spacing:.34em;color:rgba(40,36,30,.62);text-transform:uppercase}
.top{top:82px}.bot{bottom:82px;font-size:13px;color:rgba(40,36,30,.45)}
.mark{position:absolute;left:0;right:0;top:118px;text-align:center;
 font:300 italic 34px/1 "Cormorant Garamond",serif;color:rgba(40,36,30,.55);letter-spacing:.02em}
.rule{position:absolute;left:50%;width:1px;height:46px;background:rgba(40,36,30,.22);top:170px}
</style></head><body>
<div class="c">
 <div class="shade"></div>
 <svg class="leaf" viewBox="0 0 200 200"><g fill="#5a5245">
  <ellipse cx="60" cy="60" rx="70" ry="18" transform="rotate(35 60 60)"/>
  <ellipse cx="120" cy="90" rx="60" ry="15" transform="rotate(-20 120 90)"/>
  <ellipse cx="90" cy="140" rx="55" ry="14" transform="rotate(60 90 140)"/></g></svg>
 <svg class="grain" width="100%" height="100%"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .42  0 0 0 0 .38  0 0 0 .55 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
 <div class="frame"></div>
 <div class="top"><span>Journal</span><span>N°&nbsp;01</span></div>
 <div class="mark">made in sport</div>
 <div class="rule"></div>
 <div class="bot"><span>@madeinsport</span><span>2026</span></div>
</div></body></html>
