<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}body{width:var(--w);height:var(--h);overflow:hidden}
svg{display:block}
</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const W=innerWidth,H=innerHeight,y0=H*0.48,d=H*0.135;
const curve=`M0,${y0} C${W*0.02},${y0+d*0.7} ${W*0.22},${y0+d} ${W/2},${y0+d} C${W*0.78},${y0+d} ${W*0.98},${y0+d*0.7} ${W},${y0}`;
const shape=`${curve} L${W},${H} L0,${H} Z`;
document.getElementById('s').setAttribute('viewBox',`0 0 ${W} ${H}`);
document.getElementById('s').setAttribute('width',W);document.getElementById('s').setAttribute('height',H);
document.getElementById('s').innerHTML=`
<defs>
 <clipPath id="c"><path d="${shape}"/></clipPath>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f7f8fb"/><stop offset="1" stop-color="#eceef2"/></linearGradient>
 <linearGradient id="rl" x1="0" x2="1"><stop offset="0" stop-color="#e3123f"/><stop offset=".2" stop-color="#ec2f56" stop-opacity=".85"/><stop offset=".55" stop-color="#f7708c" stop-opacity=".3"/><stop offset="1" stop-color="#ff6f8c" stop-opacity="0"/></linearGradient>
 <linearGradient id="rr" x1="1" x2="0"><stop offset="0" stop-color="#e3123f"/><stop offset=".2" stop-color="#ec2f56" stop-opacity=".85"/><stop offset=".55" stop-color="#f7708c" stop-opacity=".3"/><stop offset="1" stop-color="#ff6f8c" stop-opacity="0"/></linearGradient>
 <linearGradient id="fadeV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".85" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/></linearGradient>
 <mask id="sideMask"><rect width="${W}" height="${H}" fill="url(#fadeV)"/></mask>
 <radialGradient id="glow" cx=".5" cy="0" r=".6"><stop offset="0" stop-color="#4a5bff" stop-opacity=".22"/><stop offset="1" stop-color="#4a5bff" stop-opacity="0"/></radialGradient>
 <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="${W*0.012}"/></filter>
 <filter id="crowdF" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".018 .045" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .57  0 0 0 0 .6  0 0 0 -1.6 1.05"/><feGaussianBlur stdDeviation="2.5"/></filter>
 <linearGradient id="crowdMaskG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".55" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity=".8"/></linearGradient>
 <mask id="crowdM"><rect y="${H*0.72}" width="${W}" height="${H*0.28}" fill="url(#crowdMaskG)"/></mask>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer></filter>
</defs>
<g clip-path="url(#c)">
 <rect width="${W}" height="${H}" fill="url(#bg)"/>
 <rect y="${H*0.72}" width="${W}" height="${H*0.28}" filter="url(#crowdF)" mask="url(#crowdM)" opacity=".55"/>
 <g mask="url(#sideMask)">
  <rect x="0" y="0" width="${W*0.11}" height="${H}" fill="url(#rl)"/>
  <rect x="${W*0.89}" y="0" width="${W*0.11}" height="${H}" fill="url(#rr)"/>
 </g>
 <path d="${curve}" fill="none" stroke="#5b6bff" stroke-opacity=".35" stroke-width="${W*0.03}" filter="url(#blur)"/>
 <path d="${curve}" fill="none" stroke="#ffffff" stroke-width="3"/>
 <rect width="${W}" height="${H}" filter="url(#grain)"/>
</g>`;
</script></body></html>
