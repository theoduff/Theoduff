<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}body{width:var(--w);height:var(--h);overflow:hidden}
.c{position:relative;width:100%;height:100%;
 background:
  radial-gradient(70% 55% at 10% 5%, rgba(148,235,255,.95) 0%, rgba(148,235,255,0) 70%),
  radial-gradient(80% 60% at 95% 100%, rgba(22,110,170,.9) 0%, rgba(22,110,170,0) 70%),
  linear-gradient(155deg,#94ebff 0%,#5cbfe6 40%,#2789c2 100%);}
.grid{position:absolute;inset:0;opacity:.16;
 background-image:linear-gradient(rgba(255,255,255,.9) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.9) 1px,transparent 1px);
 background-size:108px 108px;background-position:-1px -1px;
 -webkit-mask-image:linear-gradient(160deg,#000 0%,rgba(0,0,0,.45) 100%);mask-image:linear-gradient(160deg,#000 0%,rgba(0,0,0,.45) 100%)}
.grain{position:absolute;inset:0;opacity:.10;mix-blend-mode:overlay}
</style></head><body><div class="c"><div class="grid"></div>

</div></body></html>
